<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Lock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#f3f4f6; margin:0; padding:16px; display:flex; justify-content:center; }
  .card { background:#fff; max-width:440px; width:100%; padding:20px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  h1 { font-size:20px; margin:0 0 12px; }
  button { padding:14px 16px; font-size:17px; border:0; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
  button:disabled { background:#d1d5db; }
  #connect { width:100%; }
  #status { margin:12px 0; font-weight:600; }
  .gpio { display:grid; grid-template-columns:1fr; gap:10px; margin:8px 0 14px; }
  .gpio button { background:#6b7280; }
  .gpio button.on { background:#16a34a; }
  #log { background:#111827; color:#d1fae5; font-family:monospace; font-size:13px; height:130px; overflow:auto; padding:8px; border-radius:6px; white-space:pre-wrap; }
  label { display:block; font-size:13px; margin:12px 0 4px; color:#444; }
  input { width:100%; box-sizing:border-box; padding:10px; font-size:15px; border:1px solid #ccc; border-radius:6px; }
  #qr { display:flex; justify-content:center; margin:16px 0 8px; }
  .small { font-size:12px; color:#666; word-break:break-all; margin-top:6px; }
  .warn { font-size:12px; color:#b45309; margin-top:8px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">

  <!-- ===== CONTROL MODE (page opened by scanning the device QR) ===== -->
  <div id="control" class="hidden">
    <h1>ESP32 Lock</h1>
    <button id="connect">Connect</button>
    <div id="status">Not connected</div>
    <div class="gpio" id="gpio"></div>
    <div id="log"></div>
  </div>

  <!-- ===== SETUP MODE (page opened normally, to make the device QR) ===== -->
  <div id="setup" class="hidden">
    <h1>Make QR for your ESP32</h1>
    <div class="small">Use the same Device ID and Key that you wrote in the Arduino sketch (DEVICE_ID and SECRET_KEY).</div>
    <label for="idIn">Device ID</label>
    <input id="idIn" placeholder="A7K3" autocapitalize="off" autocomplete="off">
    <label for="keyIn">Secret key</label>
    <input id="keyIn" placeholder="k7Q2xM9p" autocapitalize="off" autocomplete="off">
    <button id="gen" style="margin-top:16px">Generate QR</button>
    <div id="qr"></div>
    <div class="small" id="qrUrl"></div>
    <div class="warn" id="qrWarn"></div>
  </div>

</div>

<script>
  const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // write to ESP32
  const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notifications from ESP32

  // The device ID and key come from the QR code:  ...#id=A7K3&key=k7Q2xM9p
  const params = new URLSearchParams(location.hash.slice(1));
  const ID  = params.get('id');
  const KEY = params.get('key');

  if (ID && KEY) startControl(); else startSetup();

  // ============================ SETUP MODE ============================
  function startSetup() {
    document.getElementById('setup').classList.remove('hidden');
    document.getElementById('gen').addEventListener('click', () => {
      const id  = document.getElementById('idIn').value.trim();
      const key = document.getElementById('keyIn').value.trim();
      if (!/^[A-Za-z0-9]{3,8}$/.test(id))   { alert('Device ID: 3-8 letters/numbers'); return; }
      if (!/^[A-Za-z0-9]{6,12}$/.test(key)) { alert('Key: 6-12 letters/numbers'); return; }
      const link = location.origin + location.pathname + '#id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key);
      const qr = document.getElementById('qr');
      qr.innerHTML = '';
      new QRCode(qr, { text: link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('qrUrl').textContent = link;
      document.getElementById('qrWarn').textContent =
        'This QR contains the key. Anyone who scans it can unlock this device, so keep or print it privately.';
    });
  }

  // ============================ CONTROL MODE ============================
  function startControl() {
    document.getElementById('control').classList.remove('hidden');

    const NAME = 'ESP32_' + ID;                 // only this exact device matches
    let device, rxChar;
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connect');
    const enc = t => new TextEncoder().encode(t);

    function log(t) { logEl.textContent += t + '\n'; logEl.scrollTop = logEl.scrollHeight; }
    function setStatus(t, color) { statusEl.textContent = t; statusEl.style.color = color || '#000'; }
    function setButtons(on) {
      document.querySelectorAll('.gpio button').forEach(b => { b.disabled = !on; if (!on) b.classList.remove('on'); });
    }
    function setOffline() {
      setStatus('Not connected');
      setButtons(false);
      connectBtn.textContent = 'Connect';
      connectBtn.disabled = false;
    }

    // Buttons - must match OUTPUT_PINS in the sketch
    [2, 27].forEach(pin => {
      const b = document.createElement('button');
      b.id = 'pin' + pin;
      b.textContent = pin === 27 ? 'UNLOCK' : 'LED (GPIO2)';
      b.disabled = true;
      b.addEventListener('click', async () => {
        if (!rxChar) return;
        try {
          if (pin === 27) {                       // lock: always one short unlock pulse
            await rxChar.writeValue(enc('27:1'));
            log('Me: unlock');
            return;
          }
          const turnOn = !b.classList.contains('on');
          await rxChar.writeValue(enc(pin + ':' + (turnOn ? 1 : 0)));
          log('Me: GPIO' + pin + (turnOn ? ' ON' : ' OFF'));
        } catch (err) { log('Error: ' + err.message); }
      });
      document.getElementById('gpio').appendChild(b);
    });

    function onNotify(e) {
      const text = new TextDecoder().decode(e.target.value);
      log('ESP32: ' + text);
      if (text === 'OK AUTH') {
        setStatus('Connected', '#059669');
        setButtons(true);
      } else if (text === 'ERR auth') {
        setStatus('Wrong key - scan the correct QR', '#dc2626');
        setButtons(false);
      }
      const m = text.match(/^OK (\d+):([01])$/);
      if (m) {
        const b = document.getElementById('pin' + m[1]);
        if (b) b.classList.toggle('on', m[2] === '1');
      }
    }

    async function openDevice(d) {
      device = d;
      d.ongattserverdisconnected = () => { setOffline(); log('Disconnected'); };
      setStatus('Connecting...');
      connectBtn.disabled = true;
      const server = await d.gatt.connect();
      const service = await server.getPrimaryService(NUS_SERVICE);
      rxChar = await service.getCharacteristic(NUS_RX);
      const tx = await service.getCharacteristic(NUS_TX);
      tx.oncharacteristicvaluechanged = onNotify;
      await tx.startNotifications();
      connectBtn.textContent = 'Disconnect';
      connectBtn.disabled = false;
      await rxChar.writeValue(enc('AUTH:' + KEY));   // log in with the key from the QR
    }

    async function connect() {
      if (!navigator.bluetooth) {
        alert('Web Bluetooth is not supported. Use Chrome on Android.');
        return;
      }
      try {
        // The list shows ONLY the device whose name matches this QR code
        const d = await navigator.bluetooth.requestDevice({
          filters: [{ name: NAME }],
          optionalServices: [NUS_SERVICE]
        });
        await openDevice(d);
      } catch (err) {
        log('Error: ' + err.message);
        setOffline();
      }
    }

    connectBtn.addEventListener('click', () => {
      if (device && device.gatt && device.gatt.connected) device.gatt.disconnect(); else connect();
    });

    // Best effort: if Chrome already remembers this device, connect without any tap.
    // If it is not supported on your phone, nothing happens and you just tap Connect.
    (async () => {
      try {
        if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
        const known = (await navigator.bluetooth.getDevices()).find(d => d.name === NAME);
        if (known) { log('Reconnecting...'); await openDevice(known); }
      } catch (err) { setOffline(); }
    })();
  }
</script>
</body>
</html>
